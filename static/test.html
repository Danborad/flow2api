<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>测试工作台 - Flow2API</title>
    <!-- 纯净矢量 Favicon: 白底黑色 F 字符，极简大气 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ffffff' stroke='%23cbd5e1' stroke-width='1.5'/%3E%3Ctext x='16' y='24' font-family='-apple-system, BlinkMacSystemFont, Roboto, sans-serif' font-size='22' font-weight='800' fill='%230f172a' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
        <!-- 主题防闪烁初始化：自动跟随设备颜色模式或读取用户偏好 -->
    <script>
        (function() {
            const pref = localStorage.getItem('flow2api_theme') || 'system';
            const isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        border: "hsl(0 0% 89.8%)",
                        input: "hsl(0 0% 89.8%)",
                        background: "#ffffff",
                        foreground: "hsl(0 0% 3.9%)",
                        muted: { DEFAULT: "hsl(0 0% 96.1%)", foreground: "hsl(0 0% 45.1%)" },
                        card: { DEFAULT: "#ffffff", foreground: "hsl(0 0% 3.9%)" }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .chat-bubble-enter { animation: bubbleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes bubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slide-up { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slide-up .25s ease-out; }
        html.dark {
            color-scheme: dark;
        }
        html.dark body {
            background-color: #09090b;
            color: #f4f4f5;
        }
        html.dark input, html.dark textarea, html.dark select {
            color-scheme: dark;
        }
        html.dark .text-slate-900,
        html.dark .text-slate-800 {
            color: #ffffff !important;
        }
        html.dark .text-slate-700 {
            color: #e4e4e7 !important;
        }
        html.dark .text-slate-600 {
            color: #d4d4d8 !important;
        }
        html.dark .text-slate-500 {
            color: #a1a1aa !important;
        }
        html.dark .bg-slate-50 {
            background-color: #18181b !important;
        }
        html.dark .bg-slate-100 {
            background-color: #27272a !important;
        }
        html.dark .border-slate-100,
        html.dark .border-slate-200 {
            border-color: #27272a !important;
        }

    </style>
</head>
<body class="h-screen bg-[#fafafa] dark:bg-[#09090b] text-slate-900 dark:text-zinc-100 antialiased flex overflow-hidden">

    <!-- ==================== 移动端侧边栏遮罩 (Backdrop) ==================== -->
    <div id="mobile-sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden md:hidden transition-opacity duration-200"></div>

    <!-- ==================== 侧边栏：历史任务与控制台导航 (桌面端常驻260px，移动端抽屉) ==================== -->
    <aside id="main-sidebar" class="fixed inset-y-0 left-0 z-50 w-72 md:w-64 bg-white dark:bg-[#121214] border-r border-slate-200/80 dark:border-[#27272a] flex flex-col justify-between shrink-0 select-none shadow-xl md:shadow-none -translate-x-full md:translate-x-0 md:static transition-transform duration-200 ease-in-out">
        <div class="flex-1 flex flex-col min-h-0">
            <!-- 品牌栏 (白底黑字 F 徽标 + Flow2API + 返回后台) -->
            <div class="h-14 flex items-center justify-between px-4 border-b border-slate-100 shrink-0">
                <a href="/manage" class="flex items-center gap-2.5 group" title="返回管理控制台">
                    <div class="w-7 h-7 rounded-lg bg-white border border-slate-300 shadow-sm flex items-center justify-center font-extrabold text-sm text-slate-900 font-mono shrink-0 group-hover:border-slate-500 transition-colors">
                        F
                    </div>
                    <div>
                        <span class="font-bold text-sm tracking-tight text-slate-900 block leading-none">Flow2API</span>
                        <span class="text-[10px] text-slate-400 leading-none mt-0.5 block">测试工作台</span>
                    </div>
                </a>

                <div class="flex items-center gap-1">
                    <a href="/manage" class="px-2 py-1 text-xs text-slate-500 hover:text-slate-900 rounded hover:bg-slate-100 transition-colors">
                        后台
                    </a>
                    <!-- 移动端关闭侧栏按钮 -->
                    <button onclick="toggleSidebar(false)" class="md:hidden p-1.5 text-slate-400 hover:text-slate-600 rounded-lg focus:outline-none">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>

            <!-- 新建任务按钮 -->
            <div class="p-3 border-b border-slate-100 shrink-0">
                <button onclick="newChatSession()" class="w-full flex items-center justify-center gap-2 px-3 py-2 text-xs font-semibold rounded-xl bg-slate-900 text-white hover:bg-slate-800 transition-colors shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    <span>新建生图 / 视频任务</span>
                </button>
            </div>

            <!-- 历史任务列表 -->
            <div class="flex-1 overflow-y-auto p-2 space-y-1.5 custom-scrollbar" id="chatSessionList">
                <!-- 动态填充 -->
            </div>
        </div>

        <!-- 侧栏底部：快速清空与系统状态 -->
        <div class="p-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500 shrink-0">
            <span class="inline-flex items-center gap-1.5 text-[11px] text-emerald-600 font-medium">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                <span>服务就绪</span>
            </span>
            <button onclick="clearAllChatSessions()" class="text-[11px] text-slate-400 hover:text-red-500 transition-colors px-1 py-0.5">
                清空历史
            </button>
        </div>
    </aside>

    <!-- ==================== 右侧主工作区 (Header + 聊天瀑布 + 底部输入框) ==================== -->
    <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden bg-[#fafafa] dark:bg-[#09090b]">

        <!-- 顶部状态栏 Header (移动端汉堡按钮 + 任务标题 + 操作) -->
        <header class="h-14 bg-white dark:bg-[#121214] border-b border-slate-200/80 dark:border-[#27272a] px-4 sm:px-6 flex items-center justify-between shrink-0 z-30 shadow-sm/30">
            <div class="flex items-center gap-3 min-w-0">
                <!-- 移动端汉堡按钮 (唤出侧边栏) -->
                <button onclick="toggleSidebar(true)" class="md:hidden p-1.5 -ml-1 text-slate-700 hover:bg-slate-100 rounded-lg focus:outline-none shrink-0" aria-label="打开侧边栏菜单">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="flex items-center gap-2 min-w-0">
                    <span class="font-bold text-sm text-slate-900 truncate" id="currentChatTitle">新画图任务</span>
                    <span id="currentChatBadge" class="hidden sm:inline-block text-[10px] px-1.5 py-0.2 rounded bg-slate-100 text-slate-600 font-medium shrink-0">Nano Banana 2.1</span>
                </div>
            </div>

            <!-- 右侧操作项 -->
            <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                <button onclick="newChatSession()" class="md:hidden inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-lg bg-slate-900 text-white hover:bg-slate-800 transition-colors shadow-sm">
                    <span>+ 新建</span>
                </button>
                <button onclick="clearCurrentChatMessages()" class="text-xs text-slate-400 hover:text-slate-600 transition-colors px-1.5 py-1">
                    清空对话
                </button>
                <span class="hidden sm:inline text-slate-200">|</span>
                                <!-- 外观主题切换器 (自动跟随系统 / 浅色 / 深色) -->
                <button onclick="ThemeManager.cycle()" id="theme-toggle-btn" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-zinc-700 text-xs font-medium text-slate-600 dark:text-zinc-300 hover:bg-slate-50 dark:hover:bg-zinc-800 transition-colors" title="切换外观主题 (自动跟随系统 / 浅色 / 深色)">
                    <span id="theme-toggle-icon" class="flex items-center"></span>
                    <span id="theme-toggle-text" class="hidden sm:inline">跟随系统</span>
                </button>
                <span class="hidden sm:inline text-slate-200 dark:text-zinc-700">|</span>
<a href="/manage" class="hidden sm:inline-flex items-center gap-1 text-xs font-medium text-slate-600 hover:text-slate-900 transition-colors">
                    返回管理控制台
                </a>
            </div>
        </header>

        <!-- 聊天消息瀑布流 (滚动区) -->
        <main class="flex-1 overflow-y-auto p-3 sm:p-6 space-y-4 custom-scrollbar" id="chatMessagesContainer">
            <div class="text-center py-20 text-slate-400 text-xs">
                <p>请在下方输入画面提示词，选择模型并开始生成</p>
            </div>
        </main>

        <!-- 底部输入栏 (固定底栏，自适应手机视口) -->
        <footer class="p-2.5 sm:p-4 bg-white dark:bg-[#121214] border-t border-slate-200/90 dark:border-[#27272a] shrink-0 pb-[max(0.625rem,env(safe-area-inset-bottom))]">
            <div class="max-w-4xl mx-auto bg-slate-50 rounded-xl border border-slate-200 p-2 sm:p-3 focus-within:bg-white focus-within:border-slate-400 transition-all shadow-sm">
                <!-- 垫图预览卡片 -->
                <div id="chatRefPreview" class="hidden mb-2 flex items-center gap-2 bg-slate-100 p-1.5 rounded-lg">
                    <img id="chatRefThumb" src="" class="w-8 h-8 rounded object-cover border border-slate-300">
                    <span class="text-xs text-slate-600 flex-1 truncate">已挂载参考垫图</span>
                    <button onclick="removeChatRefImage()" class="text-slate-400 hover:text-red-500 text-xs px-1">✕</button>
                </div>

                <textarea id="chatPromptInput" rows="2" placeholder="输入你想生成的画面提示词，支持粘贴截图或选择参考图..." class="w-full bg-transparent resize-none focus:outline-none text-xs text-slate-900 placeholder-slate-400 leading-relaxed"></textarea>

                <!-- 参数配置与发送按钮行 (自适应换行，单手易操作) -->
                <div class="flex items-center justify-between pt-2 border-t border-slate-200/60 mt-1 select-none flex-wrap gap-2">
                    <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                        <!-- 参考图选择 -->
                        <label class="cursor-pointer px-2 py-1 rounded bg-white border border-slate-200 hover:bg-slate-50 text-xs text-slate-700 transition-colors inline-flex items-center gap-1 shrink-0">
                            <svg class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                            <span>参考图</span>
                            <input type="file" accept="image/*" class="hidden" onchange="handleChatFileInput(event)">
                        </label>

                        <!-- 模型选择 -->
                        <select id="chatSelectModel" onchange="onChatModelChange()" class="bg-white border border-slate-200 rounded px-2 py-1 text-xs font-semibold text-slate-900 focus:outline-none cursor-pointer">
                            <option value="Nano Banana 2.1">🍌 Nano Banana 2.1 (BELUGA)</option>
                            <option value="Nano Banana 2 Lite">🍌 Nano Banana 2 Lite</option>
                            <option value="Nano Banana Pro">🍌 Nano Banana Pro</option>
                            <option value="Omni 1.1 Flash">🎬 Omni 1.1 Flash (视频)</option>
                        </select>

                        <!-- 画幅比例 -->
                        <select id="chatSelectAspect" class="bg-white border border-slate-200 rounded px-2 py-1 text-xs text-slate-700 focus:outline-none cursor-pointer">
                            <option value="9:16">9:16 竖屏</option>
                            <option value="16:9">16:9 横屏</option>
                            <option value="1:1">1:1 正方</option>
                            <option value="4:3">4:3</option>
                            <option value="3:4">3:4</option>
                        </select>

                        <!-- 分辨率 (图片模型展示) -->
                        <div id="chatBoxResolution">
                            <select id="chatSelectSize" class="bg-white border border-slate-200 rounded px-2 py-1 text-xs text-slate-700 focus:outline-none cursor-pointer">
                                <option value="2k">2K 原生重塑</option>
                                <option value="4k">4K 超分 (Lanczos3)</option>
                                <option value="1k">1K 标清</option>
                            </select>
                        </div>

                        <!-- 视频时长 (视频模型展示) -->
                        <div id="chatBoxDuration" class="hidden">
                            <select id="chatSelectDuration" class="bg-purple-50 border border-purple-200 text-purple-700 rounded px-2 py-1 text-xs font-semibold focus:outline-none cursor-pointer">
                                <option value="6">时长: 6 秒</option>
                                <option value="4">时长: 4 秒</option>
                                <option value="8">时长: 8 秒</option>
                                <option value="10">时长: 10 秒</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="handleChatSend()" id="btnChatSend" class="px-4 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-medium hover:bg-slate-800 transition-colors shrink-0 ml-auto shadow-sm">
                        生成画面
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- 媒体大图 / 视频预览 Lightbox -->
    <div id="media-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="closeMediaModal()">
        <div class="relative max-w-5xl max-h-[92vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <div id="media-modal-body" class="w-full flex items-center justify-center"></div>
            <div class="mt-3 flex items-center gap-3 text-white text-xs">
                <a id="media-modal-download" href="" download class="px-3.5 py-1.5 bg-white/20 hover:bg-white/30 rounded-lg transition-colors flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span>下载原文件</span>
                </a>
                <button onclick="closeMediaModal()" class="px-3.5 py-1.5 bg-white/20 hover:bg-white/30 rounded-lg transition-colors">
                    关闭预览
                </button>
            </div>
        </div>
    </div>

    <!-- 全局 Toast -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>

    <script>
        const $ = id => document.getElementById(id);
        const ThemeManager = {
            KEY: 'flow2api_theme',
            getPreference() { return localStorage.getItem(this.KEY) || 'system'; },
            setPreference(theme) {
                localStorage.setItem(this.KEY, theme);
                this.apply();
                this.updateUI();
                const map = { 'system': '自动跟随系统', 'light': '浅色模式', 'dark': '深色模式' };
                if (typeof showToast === 'function') showToast(`已切换外观为：${map[theme]}`, 'info', 1500);
            },
            isDark() {
                const pref = this.getPreference();
                if (pref === 'dark') return true;
                if (pref === 'light') return false;
                return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            },
            apply() {
                if (this.isDark()) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            },
            cycle() {
                const current = this.getPreference();
                const next = current === 'system' ? 'light' : (current === 'light' ? 'dark' : 'system');
                this.setPreference(next);
                return next;
            },
            init() {
                this.apply();
                if (window.matchMedia) {
                    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                        if (this.getPreference() === 'system') {
                            this.apply();
                            this.updateUI();
                        }
                    });
                }
                this.updateUI();
            },
            updateUI() {
                const pref = this.getPreference();
                const btn = $('theme-toggle-btn');
                const textEl = $('theme-toggle-text');
                const iconEl = $('theme-toggle-icon');
                if (iconEl) {
                    if (pref === 'system') {
                        iconEl.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>`;
                    } else if (pref === 'dark') {
                        iconEl.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>`;
                    } else {
                        iconEl.innerHTML = `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>`;
                    }
                }
                if (textEl) {
                    const labels = { 'system': '跟随系统', 'light': '浅色', 'dark': '深色' };
                    textEl.textContent = labels[pref];
                }
                if (btn) {
                    const titleMap = {
                        'system': '当前：自动跟随系统（点击切换）',
                        'light': '当前：浅色模式（点击切换）',
                        'dark': '当前：深色模式（点击切换）'
                    };
                    btn.title = titleMap[pref];
                }
            }
        };

        let chatSessions = [];
        let activeChatSessionId = 1;
        let attachedImageBase64 = null;
        let adminApiKey = '';

        // 侧边栏抽屉折叠交互 (移动端)
        function toggleSidebar(show) {
            const sidebar = $('main-sidebar');
            const backdrop = $('mobile-sidebar-backdrop');
            const isCurrentlyOpen = !sidebar.classList.contains('-translate-x-full');
            const shouldOpen = show !== undefined ? show : !isCurrentlyOpen;

            if (shouldOpen) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        function showToast(msg, type = 'info', duration = 2500) {
            const container = $('toast-container');
            const el = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600 text-white' : (type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-900 text-white');
            el.className = `px-4 py-2 rounded-lg text-xs font-medium shadow-xl pointer-events-auto transition-all animate-slide-up flex items-center gap-2 ${bgClass}`;
            el.textContent = msg;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                setTimeout(() => el.remove(), 250);
            }, duration);
        }

        function initChatWorkbench() {
            try {
                chatSessions = JSON.parse(localStorage.getItem('flow2api_chat_sessions') || '[]');
            } catch (e) { chatSessions = []; }
            if (!chatSessions.length) {
                chatSessions = [{
                    id: 1,
                    title: '新画图任务',
                    model: 'Nano Banana 2.1',
                    messages: []
                }];
            }
            renderChatSessionList();
            renderCurrentChatMessages();
        }

        function renderChatSessionList() {
            const list = $('chatSessionList');
            list.innerHTML = chatSessions.map(s => {
                const isActive = s.id === activeChatSessionId;
                const isVid = s.model && s.model.includes('Omni');
                return `
                    <div onclick="selectChatSession(${s.id})" class="p-2.5 rounded-xl cursor-pointer transition-colors ${isActive ? 'bg-slate-100 border border-slate-200/90 shadow-sm text-slate-900' : 'hover:bg-slate-50 border border-transparent text-slate-600'}">
                        <div class="flex items-center justify-between">
                            <p class="text-xs font-bold text-slate-800 truncate">${escapeHtml(s.title || '新任务')}</p>
                            <span class="text-[10px] px-1.5 py-0.2 rounded font-medium ${isVid ? 'bg-purple-50 text-purple-700' : 'bg-blue-50 text-blue-700'}">${isVid ? '视频' : '图片'}</span>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-1 flex justify-between">
                            <span class="truncate">${escapeHtml(s.model || 'Nano Banana 2.1')}</span>
                            <span>${s.messages ? s.messages.length : 0} 条</span>
                        </p>
                    </div>
                `;
            }).join('');
        }

        function selectChatSession(id) {
            activeChatSessionId = id;
            if (window.innerWidth < 768) {
                toggleSidebar(false);
            }
            renderChatSessionList();
            renderCurrentChatMessages();
        }

        function renderCurrentChatMessages() {
            const s = chatSessions.find(x => x.id === activeChatSessionId) || chatSessions[0];
            $('currentChatTitle').textContent = s.title || '新画图任务';
            if ($('currentChatBadge')) {
                $('currentChatBadge').textContent = s.model || 'Nano Banana 2.1';
            }
            const container = $('chatMessagesContainer');
            if (!s.messages || !s.messages.length) {
                container.innerHTML = `
                    <div class="text-center py-20 text-slate-400 text-xs">
                        <p>请在下方输入画面提示词，选择模型并开始生成</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = s.messages.map(m => {
                if (m.role === 'user') {
                    return `
                        <div class="flex items-start gap-2.5 justify-end chat-bubble-enter">
                            <div class="max-w-[88%] sm:max-w-xl bg-slate-900 text-white rounded-2xl px-4 py-2.5 shadow-sm text-xs leading-relaxed">
                                <p>${escapeHtml(m.content)}</p>
                                <div class="mt-1 text-[10px] text-slate-400 text-right">${escapeHtml(m.meta || '')}</div>
                            </div>
                        </div>
                    `;
                } else {
                    const isVid = m.mediaType === 'video';
                    return `
                        <div class="flex items-start gap-2.5 chat-bubble-enter">
                            <div class="max-w-[95%] sm:max-w-xl bg-white border border-slate-200/90 rounded-2xl p-3 shadow-sm space-y-2.5">
                                <div class="relative rounded-xl overflow-hidden bg-black">
                                    ${isVid ? `
                                        <video src="${m.url}" controls class="w-full max-h-[380px] object-cover"></video>
                                    ` : `
                                        <img src="${m.url}" class="w-full max-h-[380px] object-cover cursor-pointer hover:opacity-95" onclick="openMediaPreview('${m.url}', 'image')">
                                    `}
                                </div>
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs pt-1">
                                    <span class="text-[11px] text-emerald-600 font-medium">✅ 生成成功 · 耗时 ${m.duration || 0}s</span>
                                    <div class="flex items-center gap-1.5 self-end sm:self-auto">
                                        <button onclick="quotePrompt('${escapeHtml(m.prompt || '')}')" class="px-2.5 py-1 rounded border border-slate-200 hover:bg-slate-50 text-slate-600 text-xs">引用</button>
                                        <button onclick="copyToClipboard('${m.url}')" class="px-2.5 py-1 rounded border border-slate-200 hover:bg-slate-50 text-slate-600 text-xs">复制链接</button>
                                        <a href="${m.url}" download class="px-3 py-1 rounded bg-slate-900 text-white text-xs font-medium inline-block">下载</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        async function handleChatSend() {
            const input = $('chatPromptInput');
            const prompt = input.value.trim();
            if (!prompt) return;

            const model = $('chatSelectModel').value;
            const aspect = $('chatSelectAspect').value;
            const size = $('chatSelectSize').value;
            const duration = $('chatSelectDuration').value;
            const isVideo = model.includes('Omni');

            const s = chatSessions.find(x => x.id === activeChatSessionId);
            if (s && (!s.messages || !s.messages.length)) {
                s.title = prompt.slice(0, 16);
                s.model = model;
            }

            const metaStr = `${aspect} · ${size.toUpperCase()} · ${model}`;
            s.messages = s.messages || [];
            s.messages.push({ role: 'user', content: prompt, meta: metaStr });
            input.value = '';
            renderCurrentChatMessages();

            const container = $('chatMessagesContainer');
            const loadingBubble = document.createElement('div');
            loadingBubble.className = "flex items-start gap-2.5 chat-bubble-enter";
            loadingBubble.id = "chatLoadingBubble";
            loadingBubble.innerHTML = `
                <div class="max-w-md bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex items-center gap-2.5 text-xs text-slate-600">
                    <div class="w-4 h-4 border-2 border-slate-900 border-t-transparent rounded-full animate-spin"></div>
                    <span>正在获取 Token 并提交上游生成中...</span>
                </div>
            `;
            container.appendChild(loadingBubble);
            container.scrollTop = container.scrollHeight;

            $('btnChatSend').disabled = true;
            $('btnChatSend').textContent = '生成中...';

            const startTime = Date.now();
            try {
                let targetModel = model;
                const requestBody = {
                    model: targetModel,
                    messages: [{ role: 'user', content: prompt }],
                    stream: false,
                    size: size
                };
                if (attachedImageBase64) {
                    requestBody.messages[0].content = [
                        { type: 'text', text: prompt },
                        { type: 'image_url', image_url: { url: attachedImageBase64 } }
                    ];
                }

                const headers = { 'Content-Type': 'application/json' };
                if (adminApiKey) {
                    headers['Authorization'] = `Bearer ${adminApiKey}`;
                }

                const res = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify(requestBody),
                    credentials: 'include'
                });

                const durationSec = ((Date.now() - startTime) / 1000).toFixed(1);
                loadingBubble.remove();

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    showToast('生成失败: ' + (err.error?.message || err.detail || res.statusText), 'error');
                    return;
                }

                const data = await res.json();
                const choice = (data.choices && data.choices[0]) || {};
                const msgContent = choice.message?.content || '';
                const url = data.url || extractUrl(msgContent);

                if (url) {
                    s.messages.push({
                        role: 'assistant',
                        mediaType: isVideo ? 'video' : 'image',
                        url: url,
                        prompt: prompt,
                        duration: durationSec
                    });
                    saveChatSessions();
                    renderCurrentChatMessages();
                    renderChatSessionList();
                    showToast('生成成功！', 'success');
                } else {
                    showToast('未能提取生成的文件 URL: ' + msgContent, 'error');
                }
            } catch (err) {
                loadingBubble.remove();
                showToast('请求异常: ' + err.message, 'error');
            } finally {
                $('btnChatSend').disabled = false;
                $('btnChatSend').textContent = '生成画面';
                removeChatRefImage();
            }
        }

        function extractUrl(text) {
            if (!text) return '';
            const mImg = text.match(/!\[.*?\]\((.*?)\)/);
            if (mImg) return mImg[1];
            const mVid = text.match(/<video[^>]+src=['"](.*?)['"]/);
            if (mVid) return mVid[1];
            if (text.startsWith('http://') || text.startsWith('https://')) return text.trim();
            return '';
        }

        function saveChatSessions() {
            try {
                localStorage.setItem('flow2api_chat_sessions', JSON.stringify(chatSessions.slice(0, 20)));
            } catch (e) {}
        }

        function onChatModelChange() {
            const model = $('chatSelectModel').value;
            const isVideo = model.includes('Omni');
            $('chatBoxDuration').classList.toggle('hidden', !isVideo);
            $('chatBoxResolution').classList.toggle('hidden', isVideo);
        }

        function handleChatFileInput(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                attachedImageBase64 = evt.target.result;
                $('chatRefThumb').src = attachedImageBase64;
                $('chatRefPreview').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function removeChatRefImage() {
            attachedImageBase64 = null;
            $('chatRefPreview').classList.add('hidden');
            $('chatRefThumb').src = '';
        }

        function newChatSession() {
            const newId = Date.now();
            chatSessions.unshift({
                id: newId,
                title: '新任务',
                model: $('chatSelectModel').value,
                messages: []
            });
            activeChatSessionId = newId;
            if (window.innerWidth < 768) {
                toggleSidebar(false);
            }
            saveChatSessions();
            renderChatSessionList();
            renderCurrentChatMessages();
            $('chatPromptInput').focus();
        }

        function clearCurrentChatMessages() {
            const s = chatSessions.find(x => x.id === activeChatSessionId);
            if (s && confirm('确定清空当前任务的消息记录吗？')) {
                s.messages = [];
                saveChatSessions();
                renderCurrentChatMessages();
            }
        }

        function clearAllChatSessions() {
            if (!confirm('确定清空所有历史对话记录吗？')) return;
            chatSessions = [{
                id: Date.now(),
                title: '新画图任务',
                model: $('chatSelectModel').value,
                messages: []
            }];
            activeChatSessionId = chatSessions[0].id;
            saveChatSessions();
            renderChatSessionList();
            renderCurrentChatMessages();
            if (window.innerWidth < 768) toggleSidebar(false);
            showToast('历史记录已清空', 'info');
        }

        function openMediaPreview(url, type) {
            const modal = $('media-modal');
            const body = $('media-modal-body');
            const dl = $('media-modal-download');
            if (dl) dl.href = url;
            const isVid = type === 'video' || url.endsWith('.mp4') || url.endsWith('.webm');
            if (isVid) {
                body.innerHTML = `<video src="${url}" controls autoplay class="max-w-full max-h-[80vh] rounded-xl shadow-2xl bg-black"></video>`;
            } else {
                body.innerHTML = `<img src="${url}" class="max-w-full max-h-[82vh] rounded-xl shadow-2xl object-contain">`;
            }
            modal.classList.remove('hidden');
        }

        function closeMediaModal() {
            const modal = $('media-modal');
            const body = $('media-modal-body');
            if (body) body.innerHTML = '';
            modal.classList.add('hidden');
        }

        function quotePrompt(t) { $('chatPromptInput').value = t; $('chatPromptInput').focus(); }
        function copyToClipboard(t) { navigator.clipboard.writeText(t).then(() => showToast('链接已复制到剪贴板', 'success')); }
        function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]); }

        window.addEventListener('DOMContentLoaded', async () => {
            ThemeManager.init();
            initChatWorkbench();
            try {
                const res = await fetch('/api/admin/config', { credentials: 'include' });
                if (res.ok) {
                    const d = await res.json();
                    adminApiKey = d.api_key || '';
                }
            } catch (e) {}
        });
    </script>
</body>
</html>
